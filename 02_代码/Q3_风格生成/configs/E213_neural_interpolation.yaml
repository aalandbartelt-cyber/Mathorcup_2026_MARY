experiment: E213
target_styles: [Tripel, Kriek, Lambic]
n_repeats: 10
n_folds: 3
seeds: [20261025, 20261026, 20261027, 20261028, 20261029]
inner_folds: 2
inner_seeds: [20261026, 20261027, 20261028]
inner_split_seed: 20261026
inner_spread_log_weight: 0.25
training_seed: 20261026
device: cuda
methods: [pca_noise, neural_noise, neural_curve, neural_selected]
mixture_probabilities: [0.25, 0.5, 0.75]
model:
  hidden_dim: 32
  latent_dim: 8
  train_steps: 200
  learning_rate: 0.003
  weight_decay: 0.01
  denoising_std: 0.05
  gradient_clip: 1.0
  winsor_quantiles: [0.01, 0.99]
  covariance_pseudocount: 20
  residual_noise_strength: 0.5
  curvature_strength: 0.5
  neighbors: 3
replacement_rules:
  candidate: neural_selected
  raw_w1_max_increase: 0.01
  raw_energy_max_increase: 0.02
  robust_w1_max_increase: 0.01
  robust_energy_min_decrease: 0.005
  robust_energy_better_repeats: 7
  robust_coverage_min_increase: 0.05
  robust_log_spread_error_max_increase: 0.05
  each_style_robust_w1_max_increase: 0.02
  each_style_robust_energy_max_increase: 0.02
  near_duplicate_fraction_max: 0.0
neural_increment:
  references: [pca_noise, raw_mixture]
  energy_min_decrease: 0.002
  energy_better_repeats: 7
  w1_max_increase: 0.005
  coverage_max_decrease: 0.02
  spread_max_increase: 0.02
  each_style_w1_energy_max_increase: 0.02
clipping_rules:
  average_cell_max: 0.15
  each_style_cell_max: 0.25
fallback_order: [neural_with_increment, pca_noise_if_base_rules, frozen_copula]
q1_retrained: false
nnls_refit: false
kaggle_used_for_training: false
